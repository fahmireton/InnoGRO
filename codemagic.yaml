workflows:
  ios-simulator:
    name: VisionGRO iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.32.1
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build iOS simulator
        script: |
          flutter build ios --simulator --debug

    artifacts:
      - build/ios/iphonesimulator/Runner.app

    publishing:
      email:
        recipients:
          - gptformysiblings@gmail.com
        notify:
          success: true
          failure: true
